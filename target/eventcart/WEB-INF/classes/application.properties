# ===================================================================
# EventCart Application Configuration
# ===================================================================

# Application Information
app.name=EventCart
app.version=1.0.0
app.tagline=Discover. Book. Experience.
app.base.url=http://localhost:8080/eventcart

# Database Connection Settings (MySQL 8)
# Environment variables can override these: DB_URL, DB_USERNAME, DB_PASSWORD
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/eventcart_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.username=root
db.password=20021115

# Hibernate ORM Settings
hibernate.dialect=org.hibernate.dialect.MySQLDialect
hibernate.show_sql=false
hibernate.format_sql=true
hibernate.hbm2ddl.auto=update
hibernate.current_session_context_class=thread

# Connection Pool (C3P0 / Hikari placeholders)
hibernate.connection.pool_size=10
hibernate.connection.autocommit=false

# SMTP Mail Settings (Jakarta Mail)
# Can be overridden by SMTP_HOST, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.username=noreply.eventcart@example.com
mail.smtp.password=
mail.from.email=noreply.eventcart@example.com
mail.from.name=EventCart Notifications

# File Upload Settings
upload.directory=uploads
upload.max.file.size=10485760
upload.max.request.size=20971520

# Payment Gateway (Mock / Sandbox)
payment.gateway.mode=mock
payment.currency=USD
